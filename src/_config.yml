repository: 'reprodb/reprodb.github.io'
# url and baseurl are auto-detected by github-pages gem from the Pages API.
# Do NOT set them here — they differ between org (reprodb.github.io/) and
# forks (e.g. vahldiek.github.io/reprodb.github.io/).

markdown: kramdown
remote_theme: "mmistakes/minimal-mistakes@4.27.0"
plugins:
  - jekyll-redirect-from
  - jekyll-include-cache
  - jekyll-sitemap

# Jekyll excludes dotfiles/dot-directories by default; include .well-known so
# security.txt is copied into the built site.
include:
  - .well-known

title: ReproDB
name: ReproDB

logo: "/assets/images/logo.svg"
masthead_title: "ReproDB"

# Make stuff in _data accessible
# Collections for organizing content
collections:
  pages:
    output: true
    permalink: /:path

exclude:
  - _data/all_results_cache.yml

# Apply the default layout to all files
defaults:
  - scope:
      path: ""
    values:
      layout: "single"
      classes: "wide"

# Analytics — disabled here; the gtag snippet is injected directly in
# _includes/head/custom.html instead, since Minimal Mistakes normally emits
# this snippet near the end of <body>, which breaks Google Search Console's
# "Google Analytics" ownership-verification method (it requires <head> placement).
analytics:
  provider               : false
