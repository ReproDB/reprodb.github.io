<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" role="img" aria-label="ArtiFinder">
  <title>ArtiFinder</title>
  <!-- Artifact box -->
  <rect x="1.5" y="2" width="8" height="9" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.1"/>
  <line x1="3.4" y1="4.4" x2="7.6" y2="4.4" stroke="currentColor" stroke-width="1"/>
  <line x1="3.4" y1="6.3" x2="7.6" y2="6.3" stroke="currentColor" stroke-width="1"/>
  <line x1="3.4" y1="8.2" x2="6" y2="8.2" stroke="currentColor" stroke-width="1"/>
  <!-- Magnifier discovering the artifact -->
  <circle cx="10.3" cy="9.4" r="3" fill="none" stroke="currentColor" stroke-width="1.3"/>
  <line x1="12.5" y1="11.6" x2="15" y2="14.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>
